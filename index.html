<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Auth Callback</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      background: #111;
      border: 1px solid #222;
      max-width: 420px;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #888; font-size: 0.9rem; line-height: 1.5; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #333;
      border-top-color: #1db954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.2rem auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff4444; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">🎵</div>
    <h1>Connexion Spotify…</h1>
    <p>Redirection vers l'application locale en cours.</p>
    <div class="spinner"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.getElementById('card').innerHTML = `
        <div class="icon">❌</div>
        <h1 class="error">Autorisation refusée</h1>
        <p>Tu as refusé l'accès Spotify. Relance l'authentification depuis le terminal.</p>
      `;
    } else if (code) {
      // Forward code to local MCP auth server
      const localUrl = 'http://localhost:8888/callback?' + params.toString();
      window.location.href = localUrl;
    } else {
      document.getElementById('card').innerHTML = `
        <div class="icon">⚠️</div>
        <h1>Page introuvable</h1>
        <p>Cette page est utilisée comme callback OAuth pour le MCP Spotify.</p>
      `;
    }
  </script>
</body>
</html>
